name: Live Network & Quality Tests

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python eval/typo_bench.py
      - run: python eval/bench.py
