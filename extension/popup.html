<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>সন্ধান — সার্চ করুন</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-badge">স</div>
        <div class="brand-text">
          <span class="brand-title">সন্ধান</span>
          <span class="brand-sub">উন্মুক্ত সার্চ ইঞ্জিন</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="themeToggleBtn" class="icon-btn" title="থিম পরিবর্তন">🌙</button>
        <button id="optionsBtn" class="icon-btn" title="সেটিংস">⚙️</button>
      </div>
    </header>

    <!-- Search Form -->
    <form id="searchForm" class="search-form">
      <div class="input-wrap">
        <input
          type="text"
          id="searchInput"
          placeholder="ইন্টারনেট খুঁজুন বা !bang লিখুন..."
          autocomplete="off"
          autofocus
        />
        <button type="button" id="clearBtn" class="clear-btn" style="display: none;">✕</button>
      </div>
      <button type="submit" class="search-btn" title="অনুসন্ধান">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </form>

    <!-- Category Tabs -->
    <div class="category-tabs">
      <button class="cat-chip active" data-cat="all">সব</button>
      <button class="cat-chip" data-cat="images">ছবি</button>
      <button class="cat-chip" data-cat="videos">ভিডিও</button>
      <button class="cat-chip" data-cat="news">খবর</button>
      <button class="cat-chip" data-cat="maps">মানচিত্র</button>
    </div>

    <!-- Quick Bang Shortcuts -->
    <div class="bangs-bar">
      <span class="bangs-label">ব্যাং শর্টকাট:</span>
      <div class="bangs-list">
        <button class="bang-chip" data-bang="!w "><b>!w</b> উইকি</button>
        <button class="bang-chip" data-bang="!g "><b>!g</b> গুগল</button>
        <button class="bang-chip" data-bang="!gh "><b>!gh</b> গিটহাব</button>
        <button class="bang-chip" data-bang="!yt "><b>!yt</b> ইউটিউব</button>
      </div>
    </div>

    <!-- Live Preview / Suggestions Container -->
    <div id="previewContainer" class="preview-container" style="display: none;">
      <div class="preview-header">
        <span id="previewTitle">তাৎক্ষণিক ফলাফল</span>
        <button id="openAllBtn" class="open-all-link">সাইটে দেখুন →</button>
      </div>
      <div id="previewResults" class="preview-results"></div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>🛡️ শূন্য-জ্ঞান গোপনীয়তা · ট্র্যাকারমুক্ত</span>
      <a id="visitSiteLink" href="https://www.sandhan.site" target="_blank" rel="noreferrer">sandhan.site ↗</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
