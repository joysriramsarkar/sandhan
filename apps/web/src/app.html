<!DOCTYPE html>
<html lang="bn" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#202124" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />

		<!-- Typography: Roboto (UI) + Noto Sans Bengali (বাংলা) -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>

		<!-- Primary Meta Tags -->
		<title>সন্ধান (Sandhan) — উন্মুক্ত, গোপনীয়তা-প্রথম সার্চ ইঞ্জিন ও এআই সারসংক্ষেপ</title>
		<meta name="title" content="সন্ধান (Sandhan) — উন্মুক্ত, গোপনীয়তা-প্রথম সার্চ ইঞ্জিন ও এআই সারসংক্ষেপ" />
		<meta name="description" content="সন্ধান (Sandhan) হলো উন্মুক্ত ও গোপনীয়তা-প্রথম বাংলা সার্চ ইঞ্জিন। সরাসরি এআই সারসংক্ষেপ, নির্ভরযোগ্য ফ্যাক্ট এবং কোনো ধরনের ইউজার ট্র্যাকিং ছাড়া সুপারফাস্ট সার্চ।" />
		<meta name="keywords" content="সন্ধান, sandhan, sandhan search engine, bangla search engine, বাংলা সার্চ ইঞ্জিন, bangla ai search, privacy search engine bangladesh, fast bangla search, bangladesh ai search" />
		<meta name="author" content="Sandhan Open Source Team" />
		<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://sandhan.site/" />
		<meta property="og:site_name" content="সন্ধান (Sandhan)" />
		<meta property="og:title" content="সন্ধান (Sandhan) — উন্মুক্ত, গোপনীয়তা-প্রথম সার্চ ইঞ্জিন" />
		<meta property="og:description" content="বাংলা ভাষার প্রথম উন্মুক্ত ও প্রাইভেসি-ফার্স্ট সার্চ ইঞ্জিন। সরাসরি এআই উত্তর ও শূন্য ট্র্যাকিং।" />
		<meta property="og:image" content="https://sandhan.site/favicon.svg" />
		<meta property="og:locale" content="bn_BD" />
		<meta property="og:locale:alternate" content="en_US" />

		<!-- Twitter / X -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:url" content="https://sandhan.site/" />
		<meta name="twitter:title" content="সন্ধান (Sandhan) — উন্মুক্ত সার্চ ইঞ্জিন ও এআই সারসংক্ষেপ" />
		<meta name="twitter:description" content="উন্মুক্ত ও প্রাইভেসি-ফার্স্ট বাংলা সার্চ ইঞ্জিন। কোনো কুকিজ ও ট্র্যাকার ছাড়া দ্রুত ও নির্ভুল তথ্য সন্ধান।" />
		<meta name="twitter:image" content="https://sandhan.site/favicon.svg" />

		<!-- Structured Data (JSON-LD) for Search Engines & AI Crawlers -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@graph": [
				{
					"@type": "WebSite",
					"@id": "https://sandhan.site/#website",
					"url": "https://sandhan.site/",
					"name": "সন্ধান (Sandhan)",
					"description": "উন্মুক্ত ও গোপনীয়তা-প্রথম বাংলা সার্চ ইঞ্জিন ও এআই সারসংক্ষেপ প্ল্যাটফর্ম",
					"inLanguage": ["bn", "en", "hi"],
					"potentialAction": {
						"@type": "SearchAction",
						"target": {
							"@type": "EntryPoint",
							"urlTemplate": "https://sandhan.site/?q={search_term_string}"
						},
						"query-input": "required name=search_term_string"
					}
				},
				{
					"@type": "SoftwareApplication",
					"@id": "https://sandhan.site/#application",
					"name": "Sandhan Search",
					"applicationCategory": "SearchEngineApplication",
					"operatingSystem": "All",
					"offers": {
						"@type": "Offer",
						"price": "0",
						"priceCurrency": "USD"
					},
					"description": "Privacy-first multi-engine web search aggregator and neural QA summarizer."
				}
			]
		}
		</script>

		<!-- Apply the saved theme before first paint (no flash of the wrong theme) -->
		<script>
			try {
				var sandhanTheme = localStorage.getItem('sandhan_theme');
				if (!sandhanTheme) {
					sandhanTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.dataset.theme = sandhanTheme;
			} catch (error) {}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
